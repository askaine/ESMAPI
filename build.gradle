buildscript {
    ext.kotlin_version = '1.3.72'
    repositories {
        jcenter()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.3.72"  // Make sure to use the latest compatible Kotlin version
    }
}

plugins {
    id "org.jetbrains.kotlin.jvm" version "1.3.72"
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

version = "1.0"
group = "com.askaine_.ExoticScanMod"
archivesBaseName = "ExoticScanMod"

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

repositories {
    mavenLocal()
    maven { url 'https://libraries.minecraft.net' }
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://jitpack.io/' }
    mavenCentral()
    jcenter()
}

dependencies {
    compile 'com.github.Querz:NBT:6.1'
    compile 'com.google.code.gson:gson:2.8.5'
    compile "org.jetbrains.kotlin:kotlin-stdlib"
    compile 'org.apache.httpcomponents:httpclient:4.5.13'
    
}

sourceSets {
    main.java.srcDirs += 'src/main/kotlin'  // Kotlin sources directory
    main.kotlin.srcDirs += 'src/main/kotlin'  // Ensure Kotlin source directory is correctly included
} 

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
apply plugin: 'eclipse'
    eclipse {
    	classpath {
    		containers 'org.jetbrains.kotlin.core.KOTLIN_CONTAINER'
    	}
    }
jar {
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}